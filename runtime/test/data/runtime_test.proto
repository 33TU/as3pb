syntax = "proto3";

package as3pb.testdata;

message RuntimeNested {
  string label = 1;
  fixed32 flags = 2;
  double ratio = 3;
}

message RuntimeSample {
  string id = 1;
  bytes payload = 2;
  uint64 count = 3;
  sint64 delta = 4;
  repeated sint32 scores = 5;
  RuntimeNested nested = 6;
  repeated RuntimeNested children = 7;
  fixed64 checksum = 8;
  int32 signed_count = 11;

  oneof choice {
    string name = 9;
    RuntimeNested selected = 10;
  }
}

message RuntimeNode {
  string value = 1;
  RuntimeNode next = 2;
}
