syntax = "proto3";

package test;

import "google/protobuf/any.proto";

enum RuntimeStatus {
  RUNTIME_STATUS_UNSPECIFIED = 0;
  RUNTIME_STATUS_READY = 1;
}

message RuntimeNested {
  string label = 1;
  fixed32 flags = 2;
  double ratio = 3;
}

message RuntimeSample {
  string id = 1;
  bytes payload = 2;
  uint64 count = 3;
  sint64 delta = 4;
  repeated sint32 scores = 5;
  RuntimeNested nested = 6;
  repeated RuntimeNested children = 7;
  fixed64 checksum = 8;
  int32 signed_count = 11;
  repeated int32 expanded_scores = 12 [packed = false];
  optional int32 optional_count = 13;
  optional bool optional_enabled = 14;
  optional string optional_label = 15;
  optional bytes optional_payload = 16;
  optional uint64 optional_total = 17;
  optional RuntimeNested optional_nested = 18;
  optional sint64 optional_delta = 19;
  optional RuntimeStatus optional_status = 22;
  optional float optional_float = 23;
  optional double optional_double = 24;
  optional fixed32 optional_fixed32 = 25;
  optional fixed64 optional_fixed64 = 26;
  optional int64 optional_int64 = 27;

  oneof choice {
    string name = 9;
    RuntimeNested selected = 10;
    int64 choice_delta = 20;
    bytes choice_payload = 21;
  }
}

message RuntimeNode {
  string value = 1;
  RuntimeNode next = 2;
}

message RuntimeAnyEnvelope {
  google.protobuf.Any payload = 1;
}

message RuntimeIntegers {
  int32 int32_value = 1;
  uint32 uint32_value = 2;
  sint32 sint32_value = 3;
  fixed32 fixed32_value = 4;
  sfixed32 sfixed32_value = 5;
  int64 int64_value = 6;
  uint64 uint64_value = 7;
  sint64 sint64_value = 8;
  fixed64 fixed64_value = 9;
  sfixed64 sfixed64_value = 10;

  repeated int32 int32_values = 11;
  repeated uint32 uint32_values = 12;
  repeated sint32 sint32_values = 13;
  repeated fixed32 fixed32_values = 14;
  repeated sfixed32 sfixed32_values = 15;
  repeated int64 int64_values = 16;
  repeated uint64 uint64_values = 17;
  repeated sint64 sint64_values = 18;
  repeated fixed64 fixed64_values = 19;
  repeated sfixed64 sfixed64_values = 20;
}
